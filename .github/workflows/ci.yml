name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slot
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U slot"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://slot:ci-only-password@localhost:5432/slot
      APP_ORIGIN: http://localhost:3050
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
